<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C1/C2 English — Exercises + Reference</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #181818;
  --surface2: #212121;
  --surface3: #252525;
  --border: #2e2e2e;
  --text: #e8e4dc;
  --muted: #7a7570;
  --accent: #d4a853;
  --accent2: #c0785a;
  --correct: #4caf7d;
  --wrong: #e05c5c;
  --tag-bg: #1e1e1e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; overflow-x: hidden; }

/* ── Header ── */
header { padding: 2rem 1.5rem 1.2rem; text-align: center; border-bottom: 1px solid var(--border); position: relative; }
header::after { content:''; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%); width:80px; height:2px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
.logo { font-family:'DM Serif Display',serif; font-size:clamp(1.5rem,5vw,2.2rem); letter-spacing:-0.01em; }
.logo em { font-style:italic; color:var(--accent); }
.subtitle { margin-top:.35rem; font-size:.75rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }

/* ── Nav tabs ── */
.main-nav { display:flex; background:var(--surface); border-bottom:1px solid var(--border); }
.main-nav button { flex:1; padding:.85rem 1rem; border:none; background:transparent; color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.82rem; letter-spacing:.08em; text-transform:uppercase; border-bottom:2px solid transparent; transition:all .2s; }
.main-nav button:hover { color:var(--text); }
.main-nav button.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

/* ── Pages ── */
.page { display:none; }
.page.active { display:block; }

/* ════════════════ EXERCISE PAGE ════════════════ */
.filter-bar { display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; padding:1rem; background:var(--surface); border-bottom:1px solid var(--border); }
.filter-btn { padding:.3rem .85rem; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; border-radius:2px; transition:all .15s; }
.filter-btn:hover { border-color:var(--accent); color:var(--text); }
.filter-btn.active { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
.stats-bar { display:flex; align-items:center; gap:1.5rem; padding:.8rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); font-size:.8rem; color:var(--muted); flex-wrap:wrap; }
.stat-item strong { color:var(--accent); font-size:1.05rem; }
.streak { color:var(--accent2); }
.ex-main { max-width:760px; margin:0 auto; padding:2rem 1.2rem 5rem; }
.gen-wrap { text-align:center; margin-bottom:2rem; }
.gen-btn { display:inline-flex; align-items:center; gap:.6rem; padding:.85rem 2rem; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#000; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.92rem; font-weight:600; letter-spacing:.04em; border-radius:2px; transition:opacity .2s,transform .15s; box-shadow:0 4px 24px rgba(212,168,83,.2); }
.gen-btn:hover { opacity:.9; transform:translateY(-1px); }
.gen-btn svg { width:16px; height:16px; }
.exercise-card { background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:1.8rem; margin-bottom:1.4rem; animation:slideIn .3s ease; position:relative; overflow:hidden; }
.exercise-card::before { content:''; position:absolute; top:0; left:0; width:3px; height:100%; background:linear-gradient(180deg,var(--accent),var(--accent2)); }
@keyframes slideIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.card-header { display:flex; align-items:center; gap:.7rem; margin-bottom:1.2rem; flex-wrap:wrap; }
.tag { display:inline-block; padding:.2rem .65rem; background:var(--tag-bg); border:1px solid var(--border); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); border-radius:2px; }
.tag.cat { border-color:var(--accent); color:var(--accent); background:rgba(212,168,83,.08); }
.difficulty { margin-left:auto; font-size:.72rem; color:var(--muted); }
.question-text { font-size:1.05rem; line-height:1.8; margin-bottom:1.2rem; }
.question-text strong { font-weight:600; color:var(--accent); }
.blank-input { display:inline-block; min-width:90px; background:transparent; border:none; border-bottom:1.5px solid var(--accent); color:var(--text); font-family:'DM Sans',sans-serif; font-size:1rem; padding:0 4px 2px; outline:none; text-align:center; transition:border-color .2s; }
.blank-input:focus { border-bottom-color:#fff; }
.blank-input.correct { border-bottom-color:var(--correct); color:var(--correct); }
.blank-input.wrong { border-bottom-color:var(--wrong); color:var(--wrong); }
.choices-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:.6rem; margin-top:.5rem; }
.choice-btn { padding:.6rem 1rem; background:var(--surface2); border:1px solid var(--border); color:var(--text); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.9rem; text-align:left; border-radius:2px; transition:all .15s; line-height:1.4; }
.choice-btn:hover:not(:disabled) { border-color:var(--accent); background:rgba(212,168,83,.06); }
.choice-btn.correct { background:rgba(76,175,125,.12); border-color:var(--correct); color:var(--correct); }
.choice-btn.wrong { background:rgba(224,92,92,.1); border-color:var(--wrong); color:var(--wrong); }
.choice-btn.reveal { background:rgba(76,175,125,.08); border-color:var(--correct); color:var(--correct); }
.error-sentence { font-size:1.05rem; line-height:1.8; padding:.8rem 1rem; background:var(--surface2); border:1px solid var(--border); border-radius:2px; margin-bottom:1rem; font-style:italic; }
.error-input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:2px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:.95rem; padding:.7rem 1rem; outline:none; transition:border-color .2s; }
.error-input:focus { border-color:var(--accent); }
.transform-box { background:var(--surface2); border:1px solid var(--border); border-radius:2px; padding:.8rem 1rem; margin-bottom:1rem; font-size:.95rem; line-height:1.7; }
.transform-label { font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:.3rem; }
.key-word { display:inline-block; padding:.15rem .6rem; background:rgba(212,168,83,.12); border:1px solid var(--accent); color:var(--accent); font-weight:600; border-radius:2px; letter-spacing:.06em; margin:0 2px; }
.hint-text { font-size:.8rem; color:var(--muted); font-style:italic; margin-bottom:.8rem; padding-left:.5rem; border-left:2px solid var(--border); }
.feedback-box { margin-top:1rem; padding:.7rem 1rem; border-radius:2px; font-size:.88rem; display:none; animation:fadeIn .2s ease; }
.feedback-box.show { display:block; }
.feedback-box.ok { background:rgba(76,175,125,.1); border-left:3px solid var(--correct); color:var(--correct); }
.feedback-box.bad { background:rgba(224,92,92,.08); border-left:3px solid var(--wrong); color:#f08080; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.card-actions { display:flex; gap:.7rem; margin-top:1.2rem; flex-wrap:wrap; }
.btn { padding:.5rem 1.2rem; border:1px solid var(--border); background:transparent; color:var(--text); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.82rem; border-radius:2px; transition:all .15s; }
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
.btn-primary:hover { opacity:.85; color:#000; }
.empty-state { text-align:center; padding:4rem 2rem; color:var(--muted); }
.empty-state .big { font-family:'DM Serif Display',serif; font-size:3rem; margin-bottom:1rem; opacity:.3; }

/* ════════════════ THEORY PAGE ════════════════ */
.theory-main { max-width:860px; margin:0 auto; padding:0 1.2rem 5rem; }

/* Category nav sidebar */
.theory-layout { display:grid; grid-template-columns:220px 1fr; gap:0; align-items:start; margin-top:0; }
.theory-sidebar { position:sticky; top:0; padding:1.5rem 0 1.5rem 0; border-right:1px solid var(--border); height:100vh; overflow-y:auto; }
.theory-sidebar::-webkit-scrollbar { width:3px; }
.theory-sidebar::-webkit-scrollbar-thumb { background:var(--border); }
.theory-content { padding:2rem 0 5rem 2rem; }

.sidebar-label { font-size:.65rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); padding:.5rem 1.2rem .3rem; }
.sidebar-btn { display:block; width:100%; text-align:left; padding:.55rem 1.2rem; border:none; background:transparent; color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.82rem; border-left:2px solid transparent; transition:all .15s; }
.sidebar-btn:hover { color:var(--text); background:rgba(255,255,255,.02); }
.sidebar-btn.active { color:var(--accent); border-left-color:var(--accent); background:rgba(212,168,83,.04); }

.theory-section { display:none; animation:fadeIn .25s ease; }
.theory-section.active { display:block; }

.theory-h1 { font-family:'DM Serif Display',serif; font-size:1.8rem; margin-bottom:.3rem; }
.theory-h1 em { font-style:italic; color:var(--accent); }
.theory-intro { color:var(--muted); font-size:.88rem; margin-bottom:2rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }

/* Entry cards */
.entry-grid { display:grid; gap:.9rem; }
.entry { background:var(--surface); border:1px solid var(--border); border-radius:3px; overflow:hidden; }
.entry-head { display:flex; align-items:baseline; gap:.8rem; padding:.85rem 1.1rem .5rem; cursor:pointer; user-select:none; }
.entry-head:hover .entry-term { color:var(--accent); }
.entry-term { font-family:'DM Serif Display',serif; font-size:1.05rem; color:var(--text); transition:color .15s; }
.entry-pos { font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
.entry-arrow { margin-left:auto; font-size:.75rem; color:var(--muted); transition:transform .2s; }
.entry.open .entry-arrow { transform:rotate(180deg); }
.entry-body { display:none; padding:.1rem 1.1rem 1rem; border-top:1px solid var(--border); margin-top:.5rem; }
.entry.open .entry-body { display:block; }
.entry-meaning { font-size:.92rem; line-height:1.7; color:var(--text); margin-bottom:.6rem; }
.entry-meaning strong { color:var(--accent); font-weight:600; }
.example-row { display:flex; gap:.6rem; margin-bottom:.45rem; align-items:baseline; }
.ex-label { font-size:.65rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); flex-shrink:0; width:28px; }
.ex-text { font-size:.88rem; font-style:italic; color:#b8b0a4; line-height:1.5; }
.ex-text em { font-style:normal; color:var(--accent); font-weight:500; }
.entry-note { margin-top:.6rem; font-size:.78rem; color:var(--muted); padding:.5rem .7rem; background:var(--surface2); border-left:2px solid var(--border); border-radius:0 2px 2px 0; }
.entry-note strong { color:#a09890; }

/* Category pill */
.cat-pill { display:inline-block; padding:.15rem .55rem; font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; border-radius:2px; margin-left:.4rem; vertical-align:middle; }
.cat-pill.prep { background:rgba(76,175,125,.12); color:#4caf7d; }
.cat-pill.phrasal { background:rgba(212,168,83,.1); color:var(--accent); }
.cat-pill.idiom { background:rgba(192,120,90,.12); color:var(--accent2); }
.cat-pill.colloc { background:rgba(100,149,237,.1); color:#6495ed; }
.cat-pill.fixed { background:rgba(180,120,220,.1); color:#b478dc; }
.cat-pill.conf { background:rgba(224,92,92,.1); color:#e05c5c; }

/* Search */
.theory-search-wrap { position:sticky; top:0; z-index:10; background:var(--bg); padding:1rem 0 .8rem; border-bottom:1px solid var(--border); margin-bottom:1.5rem; }
.theory-search { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:3px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:.9rem; padding:.65rem 1rem; outline:none; transition:border-color .2s; }
.theory-search:focus { border-color:var(--accent); }
.search-count { font-size:.75rem; color:var(--muted); margin-top:.4rem; }
.no-results { text-align:center; padding:3rem; color:var(--muted); font-size:.9rem; }

@media (max-width:640px) {
  .theory-layout { grid-template-columns:1fr; }
  .theory-sidebar { position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); padding:.8rem 0; display:flex; flex-wrap:wrap; gap:.3rem; padding:.8rem 1rem; }
  .sidebar-btn { width:auto; border:1px solid var(--border); border-left:1px solid var(--border); border-radius:2px; padding:.3rem .7rem; font-size:.75rem; }
  .sidebar-btn.active { background:var(--accent); color:#000; border-color:var(--accent); }
  .sidebar-label { display:none; }
  .theory-content { padding:1.5rem 0 4rem 0; }
  .choices-grid { grid-template-columns:1fr; }
  .card-actions { flex-direction:column; }
  .main-nav button { font-size:.72rem; padding:.7rem .5rem; }
}
</style>
</head>
<body>

<header>
  <div class="logo">Advanced English <em>C1 · C2</em></div>
  <div class="subtitle">Exercise Generator · Grammar & Phrase Reference</div>
</header>

<nav class="main-nav">
  <button class="active" onclick="switchPage('exercises',this)">⚡ Exercises</button>
  <button onclick="switchPage('theory',this)">📖 Theory & Reference</button>
</nav>

<!-- ═══════════════════ EXERCISES PAGE ═══════════════════ -->
<div class="page active" id="page-exercises">
  <div class="stats-bar">
    <div class="stat-item">Attempted: <strong id="stat-attempted">0</strong></div>
    <div class="stat-item">Correct: <strong id="stat-correct">0</strong></div>
    <div class="stat-item">Accuracy: <strong id="stat-acc">—</strong></div>
    <div class="stat-item streak">Streak: <strong id="stat-streak">0</strong> 🔥</div>
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="toggleFilter('all',this)">All Types</button>
    <button class="filter-btn" onclick="toggleFilter('prepositions',this)">Prepositions</button>
    <button class="filter-btn" onclick="toggleFilter('phrasal',this)">Phrasal Verbs</button>
    <button class="filter-btn" onclick="toggleFilter('collocations',this)">Collocations</button>
    <button class="filter-btn" onclick="toggleFilter('idioms',this)">Idioms</button>
    <button class="filter-btn" onclick="toggleFilter('fixed',this)">Fixed Phrases</button>
    <button class="filter-btn" onclick="toggleFilter('wordformation',this)">Word Formation</button>
    <button class="filter-btn" onclick="toggleFilter('error',this)">Error Correction</button>
    <button class="filter-btn" onclick="toggleFilter('transformation',this)">Key Word Trans.</button>
    <button class="filter-btn" onclick="toggleFilter('register',this)">Register/Formal</button>
    <button class="filter-btn" onclick="toggleFilter('confusables',this)">Confusables</button>
  </div>
  <div class="ex-main">
    <div class="gen-wrap">
      <button class="gen-btn" onclick="generateExercise()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Generate Exercise
      </button>
    </div>
    <div id="exercise-container">
      <div class="empty-state"><div class="big">✦</div><p>Press the button to generate a random C1/C2 exercise</p></div>
    </div>
  </div>
</div>

<!-- ═══════════════════ THEORY PAGE ═══════════════════ -->
<div class="page" id="page-theory">
  <div class="theory-layout">
    <aside class="theory-sidebar">
      <div class="sidebar-label">Categories</div>
      <button class="sidebar-btn active" onclick="showTheory('prep',this)">Prepositions</button>
      <button class="sidebar-btn" onclick="showTheory('phrasal',this)">Phrasal Verbs</button>
      <button class="sidebar-btn" onclick="showTheory('colloc',this)">Collocations</button>
      <button class="sidebar-btn" onclick="showTheory('idioms',this)">Idioms</button>
      <button class="sidebar-btn" onclick="showTheory('fixed',this)">Fixed Phrases</button>
      <button class="sidebar-btn" onclick="showTheory('register',this)">Formal Register</button>
      <button class="sidebar-btn" onclick="showTheory('wordform',this)">Word Formation</button>
      <button class="sidebar-btn" onclick="showTheory('confusables',this)">Confusables</button>
      <button class="sidebar-btn" onclick="showTheory('inversion',this)">Inversion</button>
      <button class="sidebar-btn" onclick="showTheory('discourse',this)">Discourse Markers</button>
      <button class="sidebar-btn" onclick="showTheory('grammar',this)">Advanced Grammar</button>
    </aside>

    <div class="theory-content">
      <div class="theory-search-wrap">
        <input class="theory-search" id="theory-search" placeholder="Search entries…" oninput="searchTheory(this.value)">
        <div class="search-count" id="search-count"></div>
      </div>
      <div id="theory-container"></div>
    </div>
  </div>
</div>


<script src="data.js"></script>
<script>

// ══════════════════════════════════════════════════════════
//  EXERCISE ENGINE
// ══════════════════════════════════════════════════════════
let activeFilters = new Set(['all']);
let stats = { attempted:0, correct:0, streak:0 };
let lastUsed = [];
let matchState = { selected:null, matched:new Set() };
let currentCard = null;

function switchPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.main-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
}

function toggleFilter(key, btn) {
  if (key==='all') {
    activeFilters = new Set(['all']);
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  } else {
    activeFilters.delete('all');
    document.querySelector('.filter-btn:first-child').classList.remove('active');
    if (activeFilters.has(key)) {
      activeFilters.delete(key);
      btn.classList.remove('active');
      if (activeFilters.size===0) { activeFilters.add('all'); document.querySelector('.filter-btn:first-child').classList.add('active'); }
    } else {
      activeFilters.add(key);
      btn.classList.add('active');
    }
  }
}

function getPool() {
  if (activeFilters.has('all')) return Object.entries(DB).flatMap(([cat,items])=>items.map(i=>({...i,cat})));
  return [...activeFilters].flatMap(f=>(DB[f]||[]).map(i=>({...i,cat:f})));
}

function pickRandom(pool) {
  if (!pool.length) return null;
  let candidates = pool.filter((_,i)=>!lastUsed.includes(i));
  if (!candidates.length) { lastUsed=[]; candidates=pool; }
  const idx = Math.floor(Math.random()*candidates.length);
  const item = candidates[idx];
  const gi = pool.indexOf(item);
  lastUsed.push(gi);
  if (lastUsed.length>8) lastUsed.shift();
  return item;
}

function generateExercise() {
  const pool = getPool();
  if (!pool.length) { document.getElementById('exercise-container').innerHTML='<div class="empty-state"><div class="big">∅</div><p>No exercises for selected filters.</p></div>'; return; }
  const item = pickRandom(pool);
  currentCard = item;
  const catLabels = { prepositions:'Prepositions',phrasal:'Phrasal Verbs',collocations:'Collocations',idioms:'Idioms',fixed:'Fixed Phrases',wordformation:'Word Formation',error:'Error Correction',transformation:'Key Word Transformation',register:'Formal Register',confusables:'Confusables' };
  const typeLabels = { fill:'Fill in the blank',mc:'Multiple choice',error:'Find & correct the error',transform:'Key word transformation' };
  let body = '';
  if (item.type==='fill') body=renderFill(item);
  else if (item.type==='mc') body=renderMC(item);
  else if (item.type==='error') body=renderError(item);
  else if (item.type==='transform') body=renderTransform(item);
  document.getElementById('exercise-container').innerHTML=`<div class="exercise-card" id="ex-card"><div class="card-header"><span class="tag cat">${catLabels[item.cat]||item.cat}</span><span class="tag">${typeLabels[item.type]||item.type}</span><span class="difficulty">C1/C2</span></div>${body}<div class="feedback-box" id="ex-fb"></div></div>`;
  if (item.type==='fill') { const inp=document.getElementById('ex-blank'); if(inp) inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkFill();}); }
  if (item.type==='error') { const inp=document.getElementById('ex-error-inp'); if(inp) inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkError();}); }
}

function renderFill(item) {
  const hint = item.hint?`<div class="hint-text">💡 ${item.hint}</div>`:'';
  return `<div class="question-text">${item.q.replace('___','<input class="blank-input" id="ex-blank" autocomplete="off" spellcheck="false" placeholder="…">')}</div>${hint}<div class="card-actions"><button class="btn btn-primary" onclick="checkFill()">Check</button><button class="btn" onclick="generateExercise()">Skip →</button></div>`;
}
function renderMC(item) {
  const hint = item.hint?`<div class="hint-text">💡 ${item.hint}</div>`:'';
  const opts = [...item.options].sort(()=>Math.random()-.5);
  return `<div class="question-text">${item.q}</div>${hint}<div class="choices-grid">${opts.map(o=>`<button class="choice-btn" onclick="checkMC(this,'${escQ(o)}','${escQ(item.a)}')">${o}</button>`).join('')}</div>`;
}
function renderError(item) {
  return `<div class="question-text">Find and correct the error in this sentence:</div><div class="error-sentence">${item.sentence}</div><input class="error-input" id="ex-error-inp" placeholder="Type the corrected version…" autocomplete="off"><div class="card-actions"><button class="btn btn-primary" onclick="checkError()">Check</button><button class="btn" onclick="showErrorAnswer()">Show Answer</button><button class="btn" onclick="generateExercise()">Skip →</button></div>`;
}
function renderTransform(item) {
  return `<div class="question-text">Rewrite the sentence using the key word. <strong>Do not change the key word.</strong></div><div class="transform-box"><div class="transform-label">Original sentence</div>${item.original}</div><div class="transform-box"><div class="transform-label">Key word</div><span class="key-word">${item.keyword}</span></div><div class="hint-text">💡 ${item.clue}</div><div class="card-actions"><button class="btn btn-primary" onclick="showTransformAnswer()">Reveal Answer</button><button class="btn" onclick="markTransform(true)">✓ Got it</button><button class="btn" onclick="markTransform(false)">✗ Missed it</button><button class="btn" onclick="generateExercise()">Skip →</button></div>`;
}

function escQ(s){ return s.replace(/'/g,"\\'"); }
function normalise(s){ return s.trim().toLowerCase().replace(/['']/g,"'").replace(/\s+/g,' ').replace(/[.,!?;:]/g,''); }

function checkFill() {
  const inp=document.getElementById('ex-blank'); if(!inp||!currentCard) return;
  const ok=normalise(inp.value)===normalise(currentCard.a)||(currentCard.alts||[]).map(normalise).includes(normalise(inp.value));
  inp.classList.add(ok?'correct':'wrong'); inp.disabled=true;
  showFeedback(ok,currentCard.a,currentCard.explanation); recordAnswer(ok);
}
function checkMC(btn,selected,correct) {
  document.getElementById('ex-card').querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  const ok=normalise(selected)===normalise(correct);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok) document.getElementById('ex-card').querySelectorAll('.choice-btn').forEach(b=>{if(normalise(b.textContent)===normalise(correct))b.classList.add('reveal');});
  showFeedback(ok,correct,currentCard&&currentCard.hint); recordAnswer(ok);
  if(ok) setTimeout(generateExercise,1600);
}
function checkError() {
  const inp=document.getElementById('ex-error-inp'); if(!inp||!currentCard) return;
  const ok=normalise(inp.value).includes(normalise(currentCard.correction));
  inp.style.borderColor=ok?'var(--correct)':'var(--wrong)'; inp.disabled=true;
  const fb=document.getElementById('ex-fb');
  fb.className='feedback-box '+(ok?'ok':'bad')+' show';
  fb.innerHTML=ok?`✓ Correct! ${currentCard.explanation||''}`:`✗ The error is: <strong>"${currentCard.correction}"</strong>.<br>${currentCard.explanation||''}`;
  recordAnswer(ok);
  document.querySelector('.card-actions').innerHTML=`<button class="btn btn-primary" onclick="generateExercise()">Next Exercise →</button>`;
}
function showErrorAnswer() {
  const fb=document.getElementById('ex-fb');
  fb.className='feedback-box bad show';
  fb.innerHTML=`Correction: <strong>"${currentCard.correction}"</strong>.<br>${currentCard.explanation||''}`;
  document.querySelector('.card-actions').innerHTML=`<button class="btn btn-primary" onclick="generateExercise()">Next Exercise →</button>`;
}
function showTransformAnswer() {
  document.getElementById('ex-fb').className='feedback-box ok show';
  document.getElementById('ex-fb').innerHTML=`Suggested answer:<br><strong>${currentCard.answer}</strong>`;
}
function markTransform(ok) {
  recordAnswer(ok);
  const fb=document.getElementById('ex-fb');
  fb.className='feedback-box '+(ok?'ok':'bad')+' show';
  fb.innerHTML=ok?'✓ Marked as correct.':`✗ Suggested: <strong>${currentCard.answer}</strong>`;
  document.querySelector('.card-actions').innerHTML=`<button class="btn btn-primary" onclick="generateExercise()">Next Exercise →</button>`;
}
function showFeedback(ok,answer,explanation) {
  const fb=document.getElementById('ex-fb');
  fb.className='feedback-box '+(ok?'ok':'bad')+' show';
  fb.innerHTML=ok?`✓ Correct! ${explanation||''}`:`✗ Answer: <strong>"${answer}"</strong>. ${explanation||''}`;
  const actions=document.querySelector('.card-actions');
  if(actions){ const next=document.createElement('button'); next.className='btn btn-primary'; next.textContent='Next Exercise →'; next.onclick=generateExercise; actions.appendChild(next); }
}
function recordAnswer(ok) {
  stats.attempted++; if(ok){stats.correct++;stats.streak++;}else{stats.streak=0;}
  document.getElementById('stat-attempted').textContent=stats.attempted;
  document.getElementById('stat-correct').textContent=stats.correct;
  document.getElementById('stat-acc').textContent=Math.round(stats.correct/stats.attempted*100)+'%';
  document.getElementById('stat-streak').textContent=stats.streak;
}

// ══════════════════════════════════════════════════════════
//  THEORY ENGINE
// ══════════════════════════════════════════════════════════
let currentTheorySection = 'prep';

function showTheory(key, btn) {
  currentTheorySection = key;
  document.querySelectorAll('.sidebar-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('theory-search').value='';
  document.getElementById('search-count').textContent='';
  renderTheorySection(key);
}

function renderTheorySection(key) {
  const data = THEORY[key];
  if(!data) return;
  const html = `
    <div class="theory-h1">${data.title}</div>
    <div class="theory-intro">${data.intro}</div>
    <div class="entry-grid" id="entry-grid">
      ${data.entries.map((e,i)=>renderEntry(e,i)).join('')}
    </div>`;
  document.getElementById('theory-container').innerHTML = html;
}

function renderEntry(e, i) {
  const exHtml = (e.examples||[]).map(ex=>`<div class="example-row"><span class="ex-label">e.g.</span><span class="ex-text">${ex}</span></div>`).join('');
  const note = e.note ? `<div class="entry-note"><strong>⚠ Note:</strong> ${e.note}</div>` : '';
  return `<div class="entry" id="entry-${i}">
    <div class="entry-head" onclick="toggleEntry(${i})">
      <span class="entry-term">${e.term}</span>
      <span class="entry-pos">${e.pos}</span>
      <span class="entry-arrow">▾</span>
    </div>
    <div class="entry-body">
      <div class="entry-meaning">${e.meaning}</div>
      ${exHtml}
      ${note}
    </div>
  </div>`;
}

function toggleEntry(i) {
  const el = document.getElementById('entry-'+i);
  el.classList.toggle('open');
}

function searchTheory(query) {
  const q = query.trim().toLowerCase();
  if(!q) {
    renderTheorySection(currentTheorySection);
    document.getElementById('search-count').textContent='';
    return;
  }
  // search all categories
  let results = [];
  Object.entries(THEORY).forEach(([key, data])=>{
    data.entries.forEach(e=>{
      const text = (e.term+' '+e.meaning+' '+(e.examples||[]).join(' ')+' '+(e.note||'')).toLowerCase();
      if(text.includes(q)) results.push({...e, _cat: data.title});
    });
  });
  document.getElementById('search-count').textContent = `${results.length} result${results.length!==1?'s':''} found across all categories`;
  if(!results.length) {
    document.getElementById('theory-container').innerHTML='<div class="no-results">No entries found for "'+query+'"</div>';
    return;
  }
  const html = `<div class="entry-grid">${results.map((e,i)=>{
    const exHtml=(e.examples||[]).map(ex=>`<div class="example-row"><span class="ex-label">e.g.</span><span class="ex-text">${ex}</span></div>`).join('');
    const note=e.note?`<div class="entry-note"><strong>⚠ Note:</strong> ${e.note}</div>`:'';
    return `<div class="entry open" id="sr-${i}">
      <div class="entry-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="entry-term">${e.term}</span>
        <span class="entry-pos">${e.pos}</span>
        <span class="tag cat" style="margin-left:.5rem;font-size:.6rem">${e._cat}</span>
        <span class="entry-arrow">▾</span>
      </div>
      <div class="entry-body">
        <div class="entry-meaning">${e.meaning}</div>
        ${exHtml}${note}
      </div>
    </div>`;
  }).join('')}</div>`;
  document.getElementById('theory-container').innerHTML=html;
}

// Init theory
showTheory('prep', document.querySelector('.sidebar-btn'));
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)generateExercise();});
</script>
